<section id="skills" class="skills">
    <div class="container">
        <div class="section-title">
            <span>MY SKILLS</span>
            <h2>Technologies I Work With</h2>
            <p>
                A collection of technologies and tools I use to
                build modern, scalable, enterprise-grade applications.
            </p>
        </div>
        <div class="skills-grid">
            <div
                class="glass category-card"
                *ngFor="let category of categories">
                <div class="category-header">
                    <span class="icon">
                        {{category.icon}}
                    </span>
                    <h3>
                        {{category.title}}
                    </h3>
                </div>
                <div class="skill-list">
                    <span
                        class="skill-chip"
                        *ngFor="let skill of category.skills">
                        {{skill}}
                    </span>
                </div>
            </div>
        </div>
    </div>
</section>
