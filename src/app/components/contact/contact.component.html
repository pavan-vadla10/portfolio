<section id="contact" class="contact">
    <div class="container">
        <div class="section-title">
            <span>CONTACT</span>
            <h2>Let's Build Something Amazing</h2>
            <p>
                Have an opportunity, project or just want to say hello?
                I'd love to hear from you.
            </p>
        </div>
        <div class="contact-grid">
            <div class="contact-info">
                <div class="glass info-card">
                    <h3>Email</h3>
                    <p>
                        yourmail@gmail.com
                    </p>
                </div>
                <div class="glass info-card">
                    <h3>Location</h3>
                    <p>
                        Hyderabad, India
                    </p>
                </div>
                <div class="glass info-card">
                    <h3>Experience</h3>
                    <p>
                        Full Stack Developer
                    </p>
                </div>
                <div class="glass info-card">
                    <h3>Availability</h3>
                    <p>
                        Open to Opportunities
                    </p>
                </div>
            </div>
            <div class="glass contact-form">
                <input type="text" placeholder="Your Name" [(ngModel)]="contact.name">
                <input type="email" placeholder="Email Address" [(ngModel)]="contact.email">
                <input type="text" placeholder="Subject" [(ngModel)]="contact.subject">
                <textarea rows="7" placeholder="Write your message..." [(ngModel)]="contact.message">
</textarea>
                <button class="primary-btn" (click)="sendMessage()">
                    Send Message
                </button>
            </div>
        </div>
    </div>
</section>
