<section id="projects" class="projects">
    <div class="container">
        <div class="section-title">
            <span>PORTFOLIO</span>
            <h2>Featured Projects</h2>
            <p>
                A selection of enterprise applications and software solutions
                I have contributed to.
            </p>
        </div>
        <div class="project-grid">
            <div class="project-card glass" *ngFor="let project of projects">
                <div class="featured" *ngIf="project.featured">
                    Featured
                </div>
                <img [src]="project.image" [alt]="project.title">
                <div class="content">
                    <span class="subtitle">
                        {{project.subtitle}}
                    </span>
                    <h3>
                        {{project.title}}
                    </h3>
                    <p>
                        {{project.description}}
                    </p>
                    <div class="tech-stack">
                        <span *ngFor="let tech of project.technologies">
                            {{tech}}
                        </span>
                    </div>
                    <div class="buttons">
                        <button>
                            Live Demo
                        </button>
                        <button>
                            GitHub
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
